<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1>Dashboard</h1>


<p>Welcome {{ session['username'] }}</p>

<!-- Statistics Cards Here -->

<div class="row mb-4">

    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h5>Total Tasks</h5>
                <h2>{{ total_tasks }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h5>Completed Tasks</h5>
                <h2>{{ completed_tasks }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h5>Pending Tasks</h5>
                <h2>{{ pending_tasks }}</h2>
            </div>
        </div>
    </div>

</div>

<a href="/add_task" class="btn btn-success">
    Add Task
</a>
    
    <a href="/logout" class="btn btn-danger mb-3">
        Logout
    </a>

    <table class="table table-bordered">

    <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

    {% for task in tasks %}

    <tr>
        <td>{{ task[2] }}</td>
        <td>{{ task[3] }}</td>
        <td>{{ task[4] }}</td>

        <td>

    <a href="/edit_task/{{ task[0] }}"
       class="btn btn-warning btn-sm">
       Edit
    </a>

    <a href="/delete_task/{{ task[0] }}"
       class="btn btn-danger btn-sm">
       Delete
    </a>

</td>
    </tr>

    {% endfor %}

    </tbody>

</table>

</div>

</body>
</html>
