<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Edit Task</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Title</label>
            <input type="text"
                   name="title"
                   value="{{ task[2] }}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Description</label>

            <textarea name="description"
                      class="form-control">{{ task[3] }}</textarea>
        </div>

        <div class="mb-3">
            <label>Status</label>

            <select name="status" class="form-control">

                <option {% if task[4]=='Pending' %}selected{% endif %}>
                    Pending
                </option>

                <option {% if task[4]=='In Progress' %}selected{% endif %}>
                    In Progress
                </option>

                <option {% if task[4]=='Completed' %}selected{% endif %}>
                    Completed
                </option>

            </select>
        </div>

        <button class="btn btn-primary">
            Update Task
        </button>

    </form>

</div>

</body>
</html>
